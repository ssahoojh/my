<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find the Largest Number</title>

<style>
    *{
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
    }

    body{
        margin:0;
        padding:20px;
        background:#f4f6f8;
    }

    .container{
        max-width:1100px;
        margin:auto;
    }

    h1{
        text-align:center;
        margin-bottom:10px;
    }

    .section{
        background:#fff;
        padding:20px;
        margin-bottom:20px;
        border-radius:12px;
        box-shadow:0 2px 8px rgba(0,0,0,.08);
    }

    .boxes{
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
        gap:15px;
        margin-top:15px;
    }

    .box{
        border:2px solid #444;
        border-radius:10px;
        min-width:120px;
        min-height:120px;
        padding:10px;
        background:white;
        display:flex;
        flex-direction:column;
        justify-content:space-between;
        align-items:center;
    }

    .dots{
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
        gap:8px;
        min-height:70px;
        align-content:center;
    }

    .dot{
        width:16px;
        height:16px;
        border-radius:50%;
        background:black;
    }

    .number{
        font-size:26px;
        font-weight:bold;
    }

    .question{
        background:#fafafa;
        border:1px solid #ddd;
        padding:12px;
        border-radius:8px;
        margin-bottom:10px;
        font-size:22px;
    }

    textarea{
        width:100%;
        min-height:120px;
        padding:10px;
        font-size:16px;
    }

    button{
        padding:10px 20px;
        font-size:16px;
        margin-top:10px;
        cursor:pointer;
    }

    .hint{
        color:#555;
        margin-bottom:8px;
    }

    @media(max-width:600px){
        .box{
            min-width:90px;
        }

        .question{
            font-size:2rem;
        }
    }
</style>
</head>
<body>

<div class="container">

    <h1>Find the Greatest Number</h1>

    <!-- Example 1 -->
    <div class="section">
        <h2>Example 1</h2>

        <p>
            Ask: <strong>What is the largest number?</strong><br>
            If Om cannot answer, ask:
            <strong>Which box has more dots?</strong>
        </p>

        <div class="boxes">

            <div class="box">
                <div class="dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="number">3</div>
            </div>

            <div class="box">
                <div class="dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="number">2</div>
            </div>

            <div class="box">
                <div class="dots">
                    <div class="dot"></div>
                </div>
                <div class="number">1</div>
            </div>

        </div>
    </div>

    <!-- Example 2 -->
    <div class="section">
        <h2>Example 2</h2>

        <p>Ask: <strong>What number is greatest?</strong></p>

        <div class="boxes">

            <div class="box">
                <div class="dots" id="dots2"></div>
                <div class="number">2</div>
            </div>

            <div class="box">
                <div class="dots" id="dots4"></div>
                <div class="number">4</div>
            </div>

            <div class="box">
                <div class="dots" id="dots6"></div>
                <div class="number">6</div>
            </div>

        </div>
    </div>

    <!-- Questions -->
    <div class="section">
        <h2>Practice Questions</h2>

        <div class="hint">
            One question per line.<br>
            Example: 1,2,3,4|6235
        </div>

        <textarea id="data">
5,3,8,2
17,9,4,12
55,43,22,91
8,1,5,7,3
14,27,13,25
99,21,65,84
7,18,11,2,16
120,95,47,111
33,49,44,12
6,10,2,8
701,203,888,455
74,19,91,88
13,28,77,41
1000,999,1001,450
52,66,38,81
        </textarea>

        <br>
        <button onclick="renderQuestions()">
            Update Questions
        </button>

        <div id="questions" style="margin-top:20px;"></div>
    </div>

</div>

<script>

function createDots(id, count){
    const el = document.getElementById(id);

    for(let i=0;i<count;i++){
        const dot = document.createElement('div');
        dot.className='dot';
        el.appendChild(dot);
    }
}

createDots('dots2',2);
createDots('dots4',4);
createDots('dots6',6);

function renderQuestions(){

    const container = document.getElementById('questions');
    container.innerHTML='';

    const rows = document
        .getElementById('data')
        .value
        .split('\n')
        .map(x=>x.trim())
        .filter(x=>x);

    rows.forEach((row,index)=>{

        const parts = row.split('|');

        const numbers = parts[0]
            .split(',')
            .map(x=>x.trim());

        const answer = parts[1] || '';

        const div = document.createElement('div');
        div.className='question';

        div.innerHTML = `
            <strong>Q${index+1}.</strong>
            What is the greatest number?<br><br>
            ${numbers.join(' , ')}
            ${answer ? `<span style="display:none">${answer}</span>` : ''}
        `;

        container.appendChild(div);
    });

}

renderQuestions();

</script>

</body>
</html>
