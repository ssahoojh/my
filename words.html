}

    color:#555;
    line-height:1.6;
}

button{
    margin-bottom:15px;
    padding:8px 14px;
    cursor:pointer;
}

/****************************************************
 LOCAL STORAGE KEYS
****************************************************/
const ORDER_KEY = "jay_word_order_v1";
const CLICKS_KEY = "jay_word_clicks_v1";

/****************************************************
 LOAD SAVED DATA
****************************************************/
let clickData =
    JSON.parse(localStorage.getItem(CLICKS_KEY) || "{}");

/****************************************************
 SHUFFLE ONLY FIRST TIME
****************************************************/
let displayWords =
    JSON.parse(localStorage.getItem(ORDER_KEY) || "null");

if(!displayWords){

    displayWords = [...words];

    for(let i=displayWords.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [displayWords[i],displayWords[j]]
            =
        [displayWords[j],displayWords[i]];
    }

    localStorage.setItem(
        ORDER_KEY,
        JSON.stringify(displayWords)
    );
}

/****************************************************
 COLOR RULES
****************************************************/
function getStyle(clicks){

    if(clicks === 0){
        return {
            bg:"hsl(0 0% 100%)",
            color:"#000"
        };
    }

    if(clicks === 1){
        return {
            bg:"hsl(120 60% 85%)",
            color:"#000"
        };
    }

    if(clicks === 2){
        return {
            bg:"hsl(45 100% 80%)",
            color:"#000"
        };
    }

    if(clicks === 3){
        return {
            bg:"hsl(25 100% 72%)",
            color:"#000"
        };
    }

    if(clicks === 4){
        return {
            bg:"hsl(10 85% 65%)",
            color:"#fff"
        };
    }

    return {
        bg:"hsl(0 75% 50%)",
        color:"#fff"
    };
}

/****************************************************
 SAVE
****************************************************/
function saveClicks(){
    localStorage.setItem(
        CLICKS_KEY,
        JSON.stringify(clickData)
    );
}

/****************************************************
 RENDER
****************************************************/
const container =
    document.getElementById("container");

document.getElementById("wordCount")
    .textContent = displayWords.length;

displayWords.forEach(word => {

    const clicks = clickData[word] || 0;

    const div = document.createElement("div");
    div.className = "word";

    const badge = document.createElement("div");
    badge.className = "count";
    badge.textContent = clicks;

    div.appendChild(badge);
    div.append(document.createTextNode(word));

    updateAppearance(div,badge,clicks);

    div.addEventListener("click", () => {

        clickData[word] =
            (clickData[word] || 0) + 1;

        saveClicks();

        badge.textContent = clickData[word];

        updateAppearance(
            div,
            badge,
            clickData[word]
        );
    });

    // Right click decreases count
    div.addEventListener("contextmenu",(e)=>{

        e.preventDefault();

        clickData[word] =
            Math.max(
                0,
                (clickData[word] || 0) - 1
            );

        saveClicks();

        badge.textContent = clickData[word];

        updateAppearance(
            div,
            badge,
            clickData[word]
        );
    });

    container.appendChild(div);

});

function updateAppearance(div,badge,clicks){

    const style = getStyle(clicks);

    div.style.background = style.bg;
    div.style.color = style.color;

    badge.style.background =
        clicks === 0 ? "#999" : "#333";
}

/****************************************************
 RESET
****************************************************/
document
.getElementById("resetBtn")
.addEventListener("click",()=>{

    if(confirm("Reset all progress?")){

        localStorage.removeItem(CLICKS_KEY);

        location.reload();
    }

});
