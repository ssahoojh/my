<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Om Time Practice</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 10px;
        background: #f5f5f5;
    }

    h1 {
        text-align: center;
        margin: 10px 0;
    }

    .editor {
        margin-bottom: 20px;
    }

    textarea {
        width: 100%;
        min-height: 80px;
        font-size: 1rem;
        padding: 10px;
    }

    button {
        padding: 10px 16px;
        font-size: 1rem;
        margin-top: 8px;
        cursor: pointer;
    }

    .help {
        margin-top: 5px;
        color: #666;
        font-size: .9rem;
    }

    .clocks {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
    }

    .clock-card {
        background: white;
        border-radius: 8px;
        padding: 10px;
        box-shadow: 0 1px 4px rgba(0,0,0,.15);
    }

    .answer-box {
        width: 100%;
        margin-top: 10px;
        font-size: 1.25rem;
        text-align: center;
        padding: 6px;
    }

    .clock {
        position: relative;
        width: 220px;
        aspect-ratio: 1;
        border: 5px solid black;
        border-radius: 50%;
        background: white;
    }

    .number {
        position: absolute;
        transform: translate(-50%, -50%);
        font-size: 1.5rem;
        font-weight: bold;
        width: 30px;
        text-align: center;
        user-select: none;
    }

    .hand {
        position: absolute;
        left: 50%;
        bottom: 50%;
        transform-origin: bottom center;
    }

    .hour-hand {
        width: 8px;
        height: 28%;
        background: #333;
        margin-left: -4px;
        border-radius: 4px;
    }

    .minute-hand {
        width: 4px;
        height: 40%;
        background: #0078d4;
        margin-left: -2px;
        border-radius: 2px;
    }

    .center {
        position: absolute;
        width: 14px;
        height: 14px;
        background: red;
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    @media (max-width:600px) {
        .clock {
            width: 170px;
        }

        .number {
            font-size: 1.2rem;
        }
    }
</style>
</head>
<body>

<h1>🕒 Om Time Practice</h1>

<div class="editor">
    <textarea id="timesText"></textarea>
    <br>
    <button onclick="saveTimes()">Save Times</button>

    <div class="help">
        Comma separated times. Example:
        1:05,12:15,10:00,6:30
    </div>
</div>

<div id="clocks" class="clocks"></div>

<script>

const STORAGE_KEY = "OmTimePracticeClockTimes";

function initializeStorage() {

    if (localStorage.getItem(STORAGE_KEY))
        return;

    localStorage.setItem(STORAGE_KEY,"1:05,2:15,3:25,4:35,5:45,6:55,7:10,8:20,9:30,10:40,11:50,12:05,1:15,2:25,3:35,4:45,5:55,6:10,7:20,8:35");
}

function saveTimes() {

    localStorage.setItem(
        STORAGE_KEY,
        document.getElementById("timesText").value
    );

    renderClocks();
}

function createClock(timeText) {

    const [hourStr, minuteStr] = timeText.trim().split(":");

    const hour = parseInt(hourStr);
    const minute = parseInt(minuteStr);

    if (isNaN(hour) || isNaN(minute))
        return null;

    const card = document.createElement("div");
    card.className = "clock-card";

    const clock = document.createElement("div");
    clock.className = "clock";

    const size = 220;
    const center = size / 2;
    const radius = size * 0.38;

    for (let n = 1; n <= 12; n++) {

        const num = document.createElement("div");
        num.className = "number";
        num.textContent = n;

        const angle = (n - 3) * 30 * Math.PI / 180;

        num.style.left =
            center + radius * Math.cos(angle) + "px";

        num.style.top =
            center + radius * Math.sin(angle) + "px";

        clock.appendChild(num);
    }

    const hourHand = document.createElement("div");
    hourHand.className = "hand hour-hand";

    const minuteHand = document.createElement("div");
    minuteHand.className = "hand minute-hand";

    const centerDot = document.createElement("div");
    centerDot.className = "center";

    const minuteAngle = minute * 6;
    const hourAngle = (hour % 12) * 30 + minute * 0.5;

    hourHand.style.transform =
        `rotate(${hourAngle}deg)`;

    minuteHand.style.transform =
        `rotate(${minuteAngle}deg)`;

    clock.appendChild(hourHand);
    clock.appendChild(minuteHand);
    clock.appendChild(centerDot);

    card.appendChild(clock);

    const answer = document.createElement("input");
    answer.className = "answer-box";
    answer.placeholder = "What time?";
    card.appendChild(answer);

    return card;
}

function renderClocks() {

    const clocksDiv =
        document.getElementById("clocks");

    clocksDiv.innerHTML = "";

    const data =
        localStorage.getItem(STORAGE_KEY) || "";

    document.getElementById("timesText").value =
        data;

    const times =
        data.split(",")
            .map(x => x.trim())
            .filter(Boolean);

    times.forEach(time => {

        const clock = createClock(time);

        if (clock)
            clocksDiv.appendChild(clock);
    });
}

initializeStorage();
renderClocks();

</script>

</body>
</html>
