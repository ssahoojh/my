<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Om Time Practice</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 10px;
    background: #f5f5f5;
}

h1 {
    text-align: center;
    margin: 10px 0 20px;
}

.editor {
    margin-bottom: 20px;
}

textarea {
    width: 100%;
    min-height: 90px;
    padding: 10px;
    font-size: 18px;
}

button {
    padding: 10px 18px;
    font-size: 18px;
    margin-top: 10px;
    cursor: pointer;
}

.help {
    margin-top: 8px;
    color: #666;
}

.clocks {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
}

.clock-card {
    background: white;
    padding: 10px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
}

.clock {
    position: relative;
    width: 220px;
    height: 220px;
    border: 5px solid #000;
    border-radius: 50%;
    background: white;
}

.number {
    position: absolute;
    transform: translate(-50%, -50%);
    font-weight: bold;
    font-size: 28px;
    user-select: none;
}

.hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    transform-origin: bottom center;
}

.hour-hand {
    width: 8px;
    height: 28%;
    background: #333;
    margin-left: -4px;
    border-radius: 4px;
}

.minute-hand {
    width: 4px;
    height: 40%;
    background: #0078d4;
    margin-left: -2px;
    border-radius: 2px;
}

.center {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: red;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.answer-box {
    width: 100%;
    margin-top: 10px;
    padding: 8px;
    font-size: 28px;
    text-align: center;
}

@media (max-width: 600px) {

    .clock {
        width: 170px;
        height: 170px;
    }

    .number {
        font-size: 20px;
    }

    .answer-box {
        font-size: 24px;
    }
}
</style>
</head>
<body>

<h1>🕒 Om Time Practice</h1>

<div class="editor">
    <textarea id="timesText"></textarea>
    <br>
    <button onclick="saveTimes()">Save Times</button>

    <div class="help">
        Example: 1:05,2:15,3:25,4:35
    </div>
</div>

<div id="clocks" class="clocks"></div>

<script>

const STORAGE_KEY = "OmTimePracticeClockTimes";

function initializeStorage() {

    if (localStorage.getItem(STORAGE_KEY))
        return;

    localStorage.setItem(
        STORAGE_KEY,
        "1:05,2:15,3:25,4:35,5:45,6:55,7:10,8:20,9:30,10:40,11:50,12:05,1:15,2:25,3:35,4:45,5:55,6:10,7:20,8:35"
    );
}

function saveTimes() {
    localStorage.setItem(
        STORAGE_KEY,
        document.getElementById("timesText").value
    );

    renderClocks();
}

function createClock(timeText) {

    const parts = timeText.trim().split(":");

    if (parts.length !== 2)
        return null;

    const hour = parseInt(parts[0], 10);
    const minute = parseInt(parts[1], 10);

    if (isNaN(hour) || isNaN(minute))
        return null;

    const card = document.createElement("div");
    card.className = "clock-card";

    const clock = document.createElement("div");
    clock.className = "clock";

    for (let n = 1; n <= 12; n++) {

        const angle = (n - 3) * 30 * Math.PI / 180;

        const number = document.createElement("div");
        number.className = "number";
        number.textContent = n;

        number.style.left =
            (50 + Math.cos(angle) * 38) + "%";

        number.style.top =
            (50 + Math.sin(angle) * 38) + "%";

        clock.appendChild(number);
    }

    const hourHand = document.createElement("div");
    hourHand.className = "hand hour-hand";

    const minuteHand = document.createElement("div");
    minuteHand.className = "hand minute-hand";

    const centerDot = document.createElement("div");
    centerDot.className = "center";

    const minuteAngle = minute * 6;
    const hourAngle = (hour % 12) * 30 + minute * 0.5;

    hourHand.style.transform =
        `rotate(${hourAngle}deg)`;

    minuteHand.style.transform =
        `rotate(${minuteAngle}deg)`;

    clock.appendChild(hourHand);
    clock.appendChild(minuteHand);
    clock.appendChild(centerDot);

    card.appendChild(clock);

    const answerBox = document.createElement("input");
    answerBox.className = "answer-box";
    answerBox.placeholder = "What time?";

    card.appendChild(answerBox);

    return card;
}

function renderClocks() {

    const clocksContainer =
        document.getElementById("clocks");

    clocksContainer.innerHTML = "";

    const data =
        localStorage.getItem(STORAGE_KEY) || "";

    document.getElementById("timesText").value =
        data;

    const times = data
        .split(",")
        .map(t => t.trim())
        .filter(t => t.length > 0);

    times.forEach(time => {

        const clock = createClock(time);

        if (clock)
            clocksContainer.appendChild(clock);
    });
}

initializeStorage();
renderClocks();

</script>

</body>
</html>
