<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Viewer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 16px;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        h1 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-size: 1.8rem;
            line-height: 1.2;
        }

        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            /* prevents zoom on iPhone */
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        #script {
            margin-top: 16px;
        }

        #script p {
            line-height: 1.8;
            margin: 0 0 16px;
            font-size: 1rem;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 16px;
                border-radius: 0;
            }

            h1 {
                font-size: 1.4rem;
            }

            #script p {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Select Story</h2>

        <select id="storySelect">
            <option value="">-- Select a Story --</option>
        </select>

        <h1 id="title"></h1>

        <div id="script"></div>

    </div>

        "The fox flew into the air in surprise.",
        "\"WHOA!\"",
        "He landed upside down in a bush.",
        "\"I meant to do that,\" he said.",
        "The squirrel laughed so hard it nearly fell out of its tree.",
        "The fox climbed out and scratched the drum with his claws.",
        "Then he bit a hole in it.",
        "RIIIP!",
        "\"Now I shall enjoy the feast inside.\"",
        "He stuck his head into the drum.",
        "Nothing.",
        "He looked harder.",
        "Still nothing.",
        "Not a single crumb.",
        "\"You mean I was scared of an empty drum?\"",
        "The squirrel nodded.",
        "\"For half the afternoon.\"",
        "\"I don't want to talk about it,\" said the fox.",
        "At that moment his stomach growled again.",
        "\"GRRRRUMBLE!\"",
        "\"See? Even my stomach is laughing at me.\"",
        "The squirrel finally pointed toward a berry bush nearby.",
        "\"Try looking there next time.\"",
        "The fox happily ran over and found plenty to eat.",
        "As he munched on berries, he learned an important lesson.",
        "Things often seem much scarier from far away than they really are.",
        "And whenever he later heard a loud noise, he checked before panicking.",
        "Well... most of the time."
    ]
}
        ];

        const select = document.getElementById('storySelect');
        const titleEl = document.getElementById('title');
        const scriptEl = document.getElementById('script');

        stories.forEach((story, i) => {
            select.add(new Option(story.title, i));
        });

        select.addEventListener('change', () => {
            const story = stories[select.value];

            if (!story) {
                titleEl.textContent = '';
                scriptEl.innerHTML = '';
                return;
            }

            titleEl.textContent = story.title;
            renderStory(story);
        });
        let activeStory = null;

        function getStorage() {
            return JSON.parse(localStorage.getItem("spellingTracker") || "{}");
        }

        function saveStorage(data) {
            localStorage.setItem("spellingTracker", JSON.stringify(data));
        }

        function getStoryData(storyName) {
            const data = getStorage();
            return data[storyName] || {};
        }

        function setWordState(storyName, word, state) {
            const data = getStorage();

            if (!data[storyName]) {
                data[storyName] = {};
            }

            data[storyName][word] = state;

            saveStorage(data);
        }

        function normalize(word) {
            return word.toLowerCase().replace(/[^a-z]/gi, "");
        }

        function getColor(info) {
            if (!info) return "";

            if (info.state === "mastered") {
                return "hsl(120,50%,85%)";
            }

            if (info.state === "tracked") {
                return "hsl(55,100%,85%)";
            }

            const lightness = Math.max(85 - ((info.failures || 1) - 1) * 5, 50);

            return `hsl(0,100%,${lightness}%)`;
        }

        function renderStory(story) {
            activeStory = story;

            const tracked = getStoryData(story.name);

            const firstOccurrences = new Set();

            scriptEl.innerHTML = story.script.map(paragraph => {

                return paragraph.replace(/\b[\w']+\b/g, word => {

                    const key = normalize(word);

                    if (!key || key.length < 2) {
                        return word;
                    }

                    // only first occurrence
                    if (firstOccurrences.has(key)) {
                        return word;
                    }

                    firstOccurrences.add(key);

                    const info = tracked[key];
                    const color = getColor(info);

                    return `
                <span
                    class="spelling-word"
                    data-word="${key}"
                    style="${color ? `background:${color};padding:2px 4px;border-radius:4px;` : ''}"
                >${word}</span>
            `;
                });

            }).map(x => `<p>${x}</p>`).join("");

            wireWordEvents();
        }

        function updateWordElement(word) {
            const storyData = getStoryData(activeStory.name);
            const info = storyData[word];

            const el = document.querySelector(
                `.spelling-word[data-word="${word}"]`
            );

            if (!el) return;

            const color = getColor(info);

            if (!color) {
                el.style.background = "";
                return;
            }

            el.style.background = color;
            el.style.padding = "2px 4px";
            el.style.borderRadius = "4px";
        }

        function wireWordEvents() {

            const menu = document.getElementById("wordMenu");

            let selectedWord = null;

            document.querySelectorAll(".spelling-word").forEach(el => {

                el.onclick = e => {

                    selectedWord = el.dataset.word;

                    menu.style.left = e.clientX + "px";
                    menu.style.top = e.clientY + "px";
                    menu.style.display = "block";

                    e.stopPropagation();
                };
            });

            menu.onclick = e => {

                const action = e.target.dataset.action;

                if (!action || !selectedWord)
                    return;

                if (action === "clear") {

                    const data = getStorage();

                    delete data[activeStory.name]?.[selectedWord];

                    saveStorage(data);

                } else if (action === "tracked") {

                    setWordState(activeStory.name, selectedWord, {
                        state: "tracked",
                        failures: 0
                    });

                } else if (action === "mastered") {

                    setWordState(activeStory.name, selectedWord, {
                        state: "mastered",
                        failures: 0
                    });

                } else if (action === "failed") {

                    const storyData = getStoryData(activeStory.name);

                    const failures =
                        (storyData[selectedWord]?.failures || 0) + 1;

                    setWordState(activeStory.name, selectedWord, {
                        state: "failed",
                        failures
                    });
                }

                updateWordElement(selectedWord);

                menu.style.display = "none";
            };

            document.addEventListener("click", () => {
                menu.style.display = "none";
            });
        }

    </script>
    <div id="wordMenu" style="
display:none;
position:fixed;
background:white;
border:1px solid #ccc;
border-radius:8px;
box-shadow:0 2px 10px rgba(0,0,0,.2);
z-index:9999;
overflow:hidden;
">
        <div data-action="tracked">🟨 Start Learning</div>
        <div data-action="failed">🟥 Missed It</div>
        <div data-action="mastered">🟩 Mastered</div>
        <div data-action="clear">❌ Clear</div>
    </div>

    <style>
        #wordMenu div {
            padding: 10px 16px;
            cursor: pointer;
            white-space: nowrap;
        }

        #wordMenu div:hover {
            background: #f5f5f5;
        }
    </style>
