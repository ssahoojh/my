<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>The Selfish Giant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
    margin: 0;
    padding: 0.75rem;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 2rem;
    line-height: 2;
    color: #333;
    background: #fffef8;
}
h2 {
    margin: 0 0 1rem 0;
    color: #2c3e50;
    font-size: clamp(2rem, 6vw, 2.8rem);
}
#stats {
    margin-bottom: 1rem;
    font-size: 1rem;
    color: #666;
}
#story {
    max-width: 1000px;
}
.word {
    display: inline-block;
    margin: 0.1rem;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    background: #fff59d;
    border: 1px solid #e6d65a;
    min-height: 2.2rem;
}
.word:hover {
    transform: translateY(-1px);
    box-shadow: 0 2px 6px rgba(0,0,0,.12);
}
.word.mastered {
    background: #43a047 !important;
    border-color: #43a047;
    color: white;
    font-weight: bold;
}
.plain {
    margin-right: 0.15rem;
}
#moral {
    margin-top: 2rem;
    padding: 1rem;
    background: #e8f5e9;
    border-left: 6px solid #43a047;
    font-size: 1.6rem;
    line-height: 1.8;
}
@media (max-width: 600px) {
    body {
        font-size: 1.8rem;
        line-height: 2.1;
    }
    #stats {
        font-size: 1.2rem;
    }
}
</style>
</head>
<body>

<h2>The Selfish Giant</h2>

<div id="stats"></div>
<div id="story"></div>

<div id="moral">
    <strong>Moral:</strong> Sharing, kindness, and friendship bring happiness, while selfishness leads only to loneliness.
</div>

<script>
const story = `
Once upon a time, there was a beautiful garden filled with tall trees, colorful flowers, and singing birds.

Every afternoon, the children of the village came to play there. They loved the soft grass and shady trees.

At one end of the garden stood a large castle. It belonged to a giant who had been away for many years.

One day, the giant suddenly returned.

When he saw the children playing in his garden, he became angry.

"This is my garden! Leave immediately!"

The frightened children ran away.

The giant then built a high wall around the garden and placed signs warning everyone to stay out.

Without the children, the garden became sad.

The trees stopped blooming.

The flowers disappeared.

The birds flew away.

When spring arrived everywhere else, it never came to the giant's garden.

Instead, winter remained.

Snow covered the trees.

Frost painted everything white.

The North Wind blew through the garden.

Hail crashed against the castle roof.

The garden stayed cold and lifeless.

One morning, the giant heard the sweet song of a bird.

Looking outside, he was amazed.

The children had found a small opening in the wall and had returned to the garden.

As they played, the trees burst into bloom once again. Flowers blossomed, birds sang, and spring returned.

At that moment, the giant understood his mistake.

"I have been selfish," he said.

He went outside and knocked down the wall.

"From now on, this garden belongs to the children as much as it belongs to me."

The children rejoiced.

From that day forward, the giant played with them and became their friend.

Years passed, and the giant grew old.

One day, he noticed a small boy standing alone and crying.

The giant approached him kindly.

"What is wrong, little one?"

The boy showed wounds on his hands and feet.

The giant was deeply saddened.

The child gently comforted him and spoke with kindness.

Then the boy invited the giant to a beautiful paradise.

Later, when the children came looking for the giant, they found him lying peacefully in the garden, surrounded by white blossoms.

A gentle smile rested on his face.

The giant had passed away, but he had found peace through love, kindness, and selflessness.
`;

const spellingWords = new Set([
"beautiful",
"garden",
"colorful",
"village",
"afternoon",
"castle",
"belonged",
"suddenly",
"immediately",
"frightened",
"warning",
"everyone",
"blooming",
"disappeared",
"arrived",
"remained",
"covered",
"frost",
"painted",
"through",
"lifeless",
"amazed",
"opening",
"returned",
"blossomed",
"understood",
"selfish",
"knocked",
"belongs",
"rejoiced",
"friend",
"noticed",
"approached",
"kindly",
"wounds",
"saddened",
"gently",
"comforted",
"paradise",
"peacefully",
"surrounded",
"blossoms",
"rested",
"through",
"selflessness",
"kindness",
"friendship",
"loneliness"
]);

const storageKey = "spelling_" + location.pathname;
const state = JSON.parse(localStorage.getItem(storageKey) || "{}");

function save() {
    localStorage.setItem(storageKey, JSON.stringify(state));
    updateStats();
}

function updateStats() {
    const total = spellingWords.size;
    const mastered = Object.values(state)
        .filter(v => v === -1)
        .length;

    document.getElementById("stats").innerHTML =
        `✅ Mastered: ${mastered} / ${total}`;
}

function getRedColor(count) {
    const c = Math.min(count, 9);
    const lightness = 92 - ((c - 1) * 6);
    return `hsl(0, 85%, ${lightness}%)`;
}

function applyState(el, wordKey) {
    const value = state[wordKey] || 0;

    if (value === -1) {
        el.classList.add("mastered");
        el.title = "Mastered";
    } else {
        el.classList.remove("mastered");

        if (value > 0) {
            el.style.backgroundColor = getRedColor(value);
            el.title = `Missed ${value} time(s)`;
        } else {
            el.style.backgroundColor = "#fff59d";
            el.title = "Not tested yet";
        }
    }
}

const container = document.getElementById("story");

story.split(/\s+/).forEach((token, index) => {

    const clean = token
        .toLowerCase()
        .replace(/[^a-z'-]/g, "");

    if (!clean || !spellingWords.has(clean)) {
        const span = document.createElement("span");
        span.className = "plain";
        span.textContent = token + " ";
        container.appendChild(span);
        return;
    }

    const wordKey = `${clean}_${index}`;

    const span = document.createElement("span");
    span.className = "word";
    span.textContent = token;

    applyState(span, wordKey);

    span.addEventListener("click", () => {
        if (state[wordKey] === -1) {
            return;
        }

        state[wordKey] = (state[wordKey] || 0) + 1;

        if (state[wordKey] > 9) {
            state[wordKey] = 9;
        }

        applyState(span, wordKey);
        save();
    });

    span.addEventListener("dblclick", (e) => {
        e.preventDefault();

        if (state[wordKey] === -1) {
            delete state[wordKey];
        } else {
            state[wordKey] = -1;
        }

        applyState(span, wordKey);
        save();
    });

    container.appendChild(span);
    container.appendChild(document.createTextNode(" "));
});

updateStats();
</script>

</body>
</html>
